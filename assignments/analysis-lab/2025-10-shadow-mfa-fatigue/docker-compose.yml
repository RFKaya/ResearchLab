version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: mfa_fatigue_nginx
    ports:
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl:ro # Need dummy certs here
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mfa_fatigue_backend
    volumes:
      - mfa_logs:/var/log
    expose:
      - "8080"

  detector:
    build:
      context: .
      dockerfile: Dockerfile.detector
    container_name: mfa_fatigue_detector
    volumes:
      - mfa_logs:/var/log
    depends_on:
      - backend

volumes:
  mfa_logs:
