# NGINX Configuration for Shadow MFA Rate Limiting
# Protects the MFA trigger endpoint against prompt bombing / fatigue loops.

events {
    worker_connections 1024;
}

http {
    # Define a memory zone for tracking IP addresses
    # Allocation: 10 megabytes (can track ~160,000 unique IPs)
    # Rate limit: 1 request per second (1r/s)
    limit_req_zone $binary_remote_addr zone=mfa_trigger_limit:10m rate=1r/s;

    # Return HTTP status code 429 (Too Many Requests) when limit is exceeded
    limit_req_status 429;

    upstream auth_backend_servers {
        server 127.0.0.1:8080;
    }

    server {
        listen 443 ssl;
        server_name auth.company.local;

        # SSL Configuration placeholders
        ssl_certificate /etc/ssl/certs/auth.company.local.crt;
        ssl_certificate_key /etc/ssl/private/auth.company.local.key;

        # Secure location block for legacy/shadow MFA trigger route
        location /api/v1/auth/mfa/trigger {
            # Apply rate limiting from the defined zone
            # burst=2: Allow up to 2 bursts before delaying
            # nodelay: Drop excess requests immediately without queueing
            limit_req zone=mfa_trigger_limit burst=2 nodelay;

            # Log limited requests at a 'warn' level
            limit_req_log_level warn;

            proxy_pass http://auth_backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
